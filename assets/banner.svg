<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }

    /* Dynamic SVG Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.7; }
    }
    @keyframes floatWave {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 220px; }
    .wave-bg { animation: floatWave 6s ease-in-out infinite; }
    .ring-bg { animation: rotateRing 25s linear infinite; transform-origin: 1050px 160px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <g class="orb-1">
    <circle cx="200" cy="80" r="140" fill="#0369a1" opacity="0.3" filter="url(#glow)"/>
  </g>
  <g class="orb-2">
    <circle cx="1000" cy="240" r="160" fill="#6b21a8" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Animated Rotating Tech Grid Ring in Background -->
  <g class="ring-bg" opacity="0.15">
    <circle cx="1050" cy="160" r="120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" fill="none"/>
    <circle cx="1050" cy="160" r="80" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 8" fill="none"/>
  </g>

  <!-- Decorative Network Nodes Wave (Right Background) -->
  <g class="wave-bg" opacity="0.25" transform="translate(650, 40)">
    <path d="M 0 160 Q 100 80, 200 160 T 400 160 T 600 160" fill="none" stroke="url(#accentCyan)" stroke-width="3"/>
    <circle cx="200" cy="160" r="6" fill="#38bdf8"/>
    <circle cx="300" cy="120" r="4" fill="#a855f7"/>
    <circle cx="400" cy="160" r="5" fill="#ec4899"/>
  </g>

  <!-- Foreground Content Block (Ensured foreground contrast and visibility) -->
  <!-- Top Category Pill -->
  <g transform="translate(80, 50)">
    <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#38bdf8"/>
    <text x="36" y="21" class="badge-text">SEARCH ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="140" class="title">Awesome Search Engine 🔍</text>

  <!-- Subtitle -->
  <text x="80" y="190" class="subtitle">Curated Index of Commercial Search Engines &amp; Open-Source Metasearch</text>

  <!-- Decorative Bottom Stats / Tech Pills -->
  <g transform="translate(80, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="18" y="23" font-family="system-ui" font-weight="600" font-size="14" fill="#e0f2fe">🌐 Web Search</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="190" height="36" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="193" y="23" font-family="system-ui" font-weight="600" font-size="14" fill="#f3e8ff">🛡️ Metasearch &amp; Privacy</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#db2777" stroke-width="1.5"/>
    <text x="398" y="23" font-family="system-ui" font-weight="600" font-size="14" fill="#fce7f3">⚡ Application Search</text>
  </g>
</svg>
