<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.15) translate(-15px,10px);opacity:.7}}@keyframes floatWave{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes scanLine{0%{transform:translateY(-100px);opacity:0}50%{opacity:.3}}@keyframes rotateRing{0%{transform:rotate(0deg)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:54px;fill:#fff}.subtitle{font-weight:500;font-size:22px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 220px}.wave-bg{animation:floatWave 6s ease-in-out infinite}.ring-bg{animation:rotateRing 25s linear infinite;transform-origin:1050px 160px}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g class="orb-1"><circle cx="200" cy="80" r="140" fill="#0369a1" filter="url(#glow)" opacity=".3"/></g><g class="orb-2"><circle cx="1000" cy="240" r="160" fill="#6b21a8" filter="url(#glow)" opacity=".3"/></g><g class="ring-bg" opacity=".15"><circle cx="1050" cy="160" r="120" fill="none" stroke="#38bdf8" stroke-dasharray="8 12" stroke-width="2"/><circle cx="1050" cy="160" r="80" fill="none" stroke="#a855f7" stroke-dasharray="4 8" stroke-width="1.5"/></g><g class="wave-bg" opacity=".25" transform="translate(650, 40)"><path fill="none" stroke="url(#accentCyan)" stroke-width="3" d="M 0 160 Q 100 80, 200 160 T 400 160 T 600 160"/><circle cx="200" cy="160" r="6" fill="#38bdf8"/><circle cx="300" cy="120" r="4" fill="#a855f7"/><circle cx="400" cy="160" r="5" fill="#ec4899"/></g><g transform="translate(80, 50)"><rect width="240" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><circle cx="20" cy="16" r="5" fill="#38bdf8"/><text x="36" y="21" class="badge-text">SEARCH ECOSYSTEM 2026</text></g><text x="80" y="140" class="title">Awesome Search Engine 🔍</text><text x="80" y="190" class="subtitle">Curated Index of Commercial Search Engines &amp; Open-Source Metasearch</text><g transform="translate(80, 230)"><rect width="160" height="36" x="0" y="0" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="8"/><text x="18" y="23" fill="#e0f2fe" font-family="system-ui" font-size="14" font-weight="600">🌐 Web Search</text><rect width="190" height="36" x="175" y="0" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="193" y="23" fill="#f3e8ff" font-family="system-ui" font-size="14" font-weight="600">🛡️ Metasearch &amp; Privacy</text><rect width="180" height="36" x="380" y="0" fill="#0f172a" stroke="#db2777" stroke-width="1.5" rx="8"/><text x="398" y="23" fill="#fce7f3" font-family="system-ui" font-size="14" font-weight="600">⚡ Application Search</text></g></svg>